apiVersion: jenkins.io/v1alpha2
kind: Jenkins
metadata:
  name: master
spec:
  configurationAsCode:
    configurations:
      - name: jenkins-operator-user-configuration
    secret:
      name: ""
  groovyScripts:
    configurations: []
    secret:
      name: ""
  jenkinsAPISettings:
    authorizationStrategy: createUser
  master:
    disableCSRFProtection: false
    basePlugins:
    - name: kubernetes
      version: "1.31.3"
    - name: workflow-job
      version: "2.42"
    - name: workflow-aggregator
      version: "2.7"
    - name: git
      version: "4.10.0"
    - name: job-dsl
      version: "1.78.1"
    - name: configuration-as-code
      version: "1.55"
    - name: kubernetes-credentials-provider
      version: "0.20"
    - name: workflow-multibranch
      version: "706.vd43c65dec013"
    - name: ansicolor
      version: "1.0.1"
    - name: timestamper
      version: "1.17"
    - name: credentials
      version: "2.6.2"
    containers:
      - name: jenkins-master
        image: jenkins/jenkins:2.319.1-lts-alpine
        imagePullPolicy: IfNotPresent
        env:
          - name: JENKINS_OPTS
            value: --prefix=/jenkins
        livenessProbe:
          failureThreshold: 12
          httpGet:
            path: /login
            port: http
            scheme: HTTP
          initialDelaySeconds: 100
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 5
        readinessProbe:
          failureThreshold: 10
          httpGet:
            path: /login
            port: http
            scheme: HTTP
          initialDelaySeconds: 80
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        resources:
          limits:
            cpu: 1500m
            memory: 1Gi
          requests:
            cpu: 100m
            memory: 256Mi
  seedJobs:
    - id: jenkins-operator
      credentialType: basicSSHUserPrivateKey
      credentialID: git-gl-test-ssh
      targets: "cicd/jobs/*.jenkins"
      description: "Main Gorilla Logic Challenge repository"
      repositoryBranch: main
      repositoryUrl: git@github.com:snwbr/gl-test.git
