---
apiVersion: traefik.containo.us/v1alpha1
kind: IngressRoute
metadata:
  name: jenkins
  namespace: apps
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - match: Host(`snwbr.net/jenkins`)
      kind: Rule
      services:
        - name: jenkins
          port: 8080
  # Use the secret generated by cert-manager
  tls:
    secretName: snwbr-net-tls
