---
apiVersion: traefik.containo.us/v1alpha1
kind: IngressRoute
metadata:
  name: jenkins
spec:
  entryPoints:
    - websecure
  routes:
    - match: Path(`/jenkins`)
      kind: Rule
      services:
      - name: jenkins
        port: 8080
  # Use the secret generated by cert-manager
  tls:
    secretName: snwbr-net-tls
