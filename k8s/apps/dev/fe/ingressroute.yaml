---
apiVersion: traefik.containo.us/v1alpha1
kind: IngressRoute
metadata:
  name: hello-world
  namespace: apps
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - match: Host(`snwbr.net`)
      kind: Rule
      services:
        - name: hello-world
          port: 8080
      ## Default fallback goes to FE
    - match: PathPrefix(`/`) 
      kind: Rule
      priority: 1
      services:
      - name: hello-world
        port: 8080
      middlewares:
      - name: redirectregex
  # Use the secret generated by cert-manager
  tls:
    secretName: hello-world-tls
---
# Redirect with domain replacement
apiVersion: traefik.containo.us/v1alpha1
kind: Middleware
metadata:
  name: redirectregex
spec:
  redirectRegex:
    regex: ^https://(.*)snwbr.net/(.*)
    replacement: https://snwbr.net/${2}
